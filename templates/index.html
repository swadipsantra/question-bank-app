<!DOCTYPE html>
<html>
<head>
    <title>Question Bank Generator</title>

    <style>
        body {
            font-family: Arial;
            background: linear-gradient(to right, #ffe6f0, #f9f0ff);
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #8e44ad;
        }

        form {
            text-align: center;
            margin-bottom: 20px;
        }

        input[type="text"] {
            padding: 10px;
            width: 250px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 15px;
            background-color: #8e44ad;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #732d91;
        }

        .paper {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 800px;
            margin: auto;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }

        .paper h2 {
            text-align: center;
            border-bottom: 2px solid #8e44ad;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .content {
            font-size: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .print-btn {
            text-align: center;
            margin-top: 20px;
        }

        /* 🖨 Print style */
        @media print {
            body {
                background: white;
            }

            form, .print-btn {
                display: none;
            }

            .paper {
                box-shadow: none;
                border: none;
            }
        }
    </style>
</head>

<body>

<h1>🌸 Topic-Based Question Generator</h1>

<form method="POST">
    <input type="text" name="topic" placeholder="Enter topic" required>
    <button type="submit">Generate</button>
</form>

{% if questions %}
<div class="paper">

    <h2>📄 Question Paper</h2>

    <div class="content">
        {{ questions }}
    </div>

</div>

<div class="print-btn">
    <button onclick="window.print()">🖨 Print Question Paper</button>
</div>
{% endif %}

</body>
</html>
